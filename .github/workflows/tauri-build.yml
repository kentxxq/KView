name: Tauri Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: 校验正式发布
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 校验版本及发布来源
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs validate

  build:
    name: 构建 ${{ matrix.platform }}
    needs: validate
    if: ${{ !cancelled() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            bundles: nsis
          - platform: macos-arm64
            runner: macos-15
            bundles: app,dmg
          - platform: macos-x64
            runner: macos-15-intel
            bundles: app,dmg
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Vite+ 和 Node.js
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: false
      - name: 安装前端依赖
        run: vp install --frozen-lockfile
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: 构建普通安装包
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        run: vpr tauri build --bundles ${{ matrix.bundles }} -- --locked
      - name: 构建并签名正式更新包
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '缺少 TAURI_SIGNING_PRIVATE_KEY，停止正式发布。' >&2
            exit 1
          fi
          vpr tauri build --bundles '${{ matrix.bundles }}' --config src-tauri/tauri.release.conf.json -- --locked
      - name: 整理安装包及更新签名
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          # 手动运行标签时也仅保留普通构建物。
          RELEASE_SIGNED: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: vpr release:stage
      - name: 暂存构建物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/kview-release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布版本及更新清单
    needs: [validate, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 检出完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 下载三个平台的构建物
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/kview-release
      - name: 草稿上传完成后公开正式版本
        run: node scripts/release.mjs publish
