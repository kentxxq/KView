name: 整理发布名称

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-metadata.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-release
  cancel-in-progress: false

jobs:
  normalize:
    name: 整理最新正式版本及历史标题
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 检出发布脚本和标签
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 更新最新版本标题并清理已存档的重复 Release
        run: node scripts/release.mjs normalize
